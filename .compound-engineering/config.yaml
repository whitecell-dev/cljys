# Compound Engineering configuration for cljys.
#
# Deliberately minimal. Every key here is a default a CE skill may override
# per-run; there is no behavior worth pinning that the repo's own files and the
# yamlscript-semantics pack do not already state.
#
# Nothing in this file is host-global: it applies to this checkout only.

# Every CE-written artifact (plans, solutions/learnings, ideation, pulse
# reports) would live under docs/, which is CE's default and is committed, so
# the knowledge compounds for everyone who clones rather than one checkout only.
# `docs/` does not exist in the tree yet; this key declares a location for CE to
# write into, it does not describe a directory that is currently there.
docs_root: docs

# Prescriptive YAMLScript<->Clojure equivalence rules. Planning grounds in
# these; review flags diffs that contradict them, citing (pack: yamlscript-
# semantics, <file>). This is the mechanism that stops the range-class bug
# (REPORT.md section 10) from recurring.
packs:
  - source: compound-packs/yamlscript-semantics
